<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VistaGrid</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="loading">Loading...</div>

    <button id="theme-switch">
        <i class="fa-regular fa-sun"></i>
        <i class="fa-regular fa-moon"></i>
    </button>

    <div class="header">
        <div class="logo-container">
            <a href="/" class="logo-link">
                <div class="logo-icon-wrapper">
                    <div class="logo-glow"></div>
                    <div class="logo-box">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>
                <span class="logo-text">
                    <span class="logo-text-white">Vista</span><span class="logo-text-gradient">Grid</span>
                </span>
            </a>
        </div>
        <div class="container">
            <form action="search.html" class="search-bar" method="GET">
                <input type="text" name="query" id="search-input" placeholder="Search posts" required/>
                <button type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
